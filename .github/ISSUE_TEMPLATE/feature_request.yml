name: An idea
description: Something you would like Obelo to do.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Obelo is kept small on purpose, so the more you say about the problem you are solving, the better.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see
  - type: textarea
    id: alternatives
    attributes:
      label: What you do today instead
