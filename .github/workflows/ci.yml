# Runs on every push to main and on pull requests: the server tests (against a throwaway Postgres),
# a dependency audit, and a check that the Docker image still builds.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: obelo_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d obelo_test"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      # The test script refuses any database whose name does not end in _test
      TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/obelo_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm test

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm audit --omit=dev

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
